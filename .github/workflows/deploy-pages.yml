# Her push'ta site dosyalarını gh-pages dalına yayınlar (GitHub Pages)
name: GitHub Pages yayını

on:
  push:
    branches: [claude/mekatrohome-website-redesign-h3ff97]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
      - name: gh-pages dalına yayınla
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github,CLAUDE.md,README.md'
          commit_message: 'Site yayını'
          cname: www.mekatrohome.com
